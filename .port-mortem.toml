track         = "A"
source_repo   = "https://github.com/intel/tinycbor"
source_commit = "9441b2ca882f95849c93de03f2c754196db13154"
source_lang   = "C"
target_lang   = "Rust"
kickoff_hash  = "ee5617f3372ebd32f4540001c21cea76fa46610b43197589c8a4a57b4b685aed"

repo          = "https://github.com/keirsalterego/0xicbor"
docs          = "https://keirsalterego.github.io/0xicbor/"
phase         = "port"

# Upstream source measured at kickoff: 6456 lines across src/, under the 8k cap.
source_lines  = 6456

[suite]
# Upstream's own build reports 4931 rows. tst_cpp accounts for 2 of them and
# cannot pass by construction: it #includes upstream's .c files directly.
# See decisions.md entry 2.
upstream_rows = 4931
reachable     = 4929
passing       = 4929
failing       = 0

[parity]
# nm -g --defined-only, sorted, diffed against bench/reference/symbols-upstream.txt
symbols_upstream = 44
symbols_ours     = 44
symbol_diff      = 0
abi_layout       = "asserted"

[budget]
# grep -rn "unsafe {" crates/ --include='*.rs' | wc -l — blocks, not mentions.
unsafe_blocks = 80
fuzz_seconds  = 4205  # 601s pretty + 1502s json + 901s validate + 1201s encode
# Two real divergences found by fuzzing. The pretty printer had no
# CborInvalidType arm, at 420,793 execs in a 900s run. cbor_encode_simple_value
# rejected simple value 24, which upstream encodes, at 2,653 execs on the new
# encoder target's first run. Both fixed, both kept as regression fixtures in
# tests/port/corpus/, and the runs above re-verify them.
divergences_found = 2
divergences_open  = 0
# Found instead by building tests for what nothing else reached: the
# CborErrorIO the two converters threw away (reader differential), and four
# in cbordump, which is a second implementation the library's tests never
# touch. All fixed, all now in `make test`. See decisions.md 18.
bugs_found_by_tests = 5
decisions     = 18
upstream_issue = "https://github.com/intel/tinycbor/issues/331"

[bench]
# bench/results.json, mean of rust_vs_c_p50 across the 8 corpus files.
# Greater than 1.0 means this port is slower than the C.
parse_p50_mean  = 0.366
parse_p50_range = "0.26 - 0.48"
files_slower    = 0
files_faster    = 8
pretty_p50_mean = 0.226
