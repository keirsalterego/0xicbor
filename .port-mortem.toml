track         = "A"
source_repo   = "https://github.com/intel/tinycbor"
source_commit = "9441b2ca882f95849c93de03f2c754196db13154"
source_lang   = "C"
target_lang   = "Rust"
kickoff_hash  = "ee5617f3372ebd32f4540001c21cea76fa46610b43197589c8a4a57b4b685aed"

repo          = "https://github.com/keirsalterego/0xicbor"
docs          = "https://keirsalterego.github.io/0xicbor/"
phase         = "port"

# Upstream source measured at kickoff: 6456 lines across src/, under the 8k cap.
source_lines  = 6456

[suite]
# Upstream's own build reports 4931 rows. tst_cpp accounts for 2 of them and
# cannot pass by construction: it #includes upstream's .c files directly.
# See decisions.md entry 2.
upstream_rows = 4931
reachable     = 4929
passing       = 4929
failing       = 0

[parity]
# nm -g --defined-only, sorted, diffed against bench/reference/symbols-upstream.txt
symbols_upstream = 44
symbols_ours     = 44
symbol_diff      = 0
abi_layout       = "asserted"

[budget]
# grep -rn "unsafe {" crates/ --include='*.rs' | wc -l — blocks, not mentions.
unsafe_blocks = 80
fuzz_seconds  = 601  # latest run; see the history in docs/src/verification
# One real divergence found, at 420,793 execs in an earlier 900s run: the
# pretty printer had no CborInvalidType arm. Fixed, kept as a regression
# fixture in tests/port/corpus/, and the 901s run above is the re-verification.
divergences_found = 1
divergences_open  = 0
decisions     = 16

[bench]
# bench/results.json, mean of rust_vs_c_p50 across the 8 corpus files.
# Greater than 1.0 means this port is slower than the C.
parse_p50_mean  = 0.362
parse_p50_range = "0.26 - 0.50"
files_slower    = 0
files_faster    = 8
pretty_p50_mean = 0.222
