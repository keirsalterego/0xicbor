name: docs

on:
  # Twice a day rather than on every push. The docs change far less often than
  # the code, and a run per commit is mostly noise.
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace a pending one, but never interrupt a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by digest, not just by version tag. This job holds pages:write and
      # id-token:write, so anything that executes here can deploy as us. Piping a
      # download straight into tar would mean a swapped release asset gets those
      # credentials. Verify first, extract second.
      - name: Install mdbook
        env:
          MDBOOK_VERSION: "0.4.40"
          MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSLf --proto '=https' --tlsv1.2 \
            -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  /tmp/mdbook.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mdbook.tar.gz --directory="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A broken relative link builds into a 404 without mdbook saying a word,
      # so a rotted page looks fine until somebody clicks it.
      - name: Check links
        run: ./docs/check-links.py

      - name: Build
        run: mdbook build docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
